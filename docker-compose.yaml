services:
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: data-generator
    ports:
      - "8080:8080"
      - "2112:2112"
    depends_on:
      - kafka
    env_file:
      - .env
    networks:
      - app-network

  producer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: producer
    ports:
      - "2113:2113"
    depends_on:
      - kafka
      - data-generator
    env_file:
      - .env
    networks:
      - app-network

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: consumer
    ports:
      - "2114:2114"
    env_file:
      - .env
    depends_on:
      - kafka
      - postgres
      - producer
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_URL}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  postgres:
    image: postgres:latest
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DBNAME}
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - app-network
    depends_on:
      - prometheus

networks:
  app-network:
    driver: bridge
